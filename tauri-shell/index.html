<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>StepAlbum</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #0a0a0f;
    color: #e5e5ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    text-align: center;
    padding: 24px;
  }
  img {
    width: 84px;
    height: 84px;
    opacity: 0.95;
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
  }
  p {
    font-size: 13px;
    color: #9a9aa5;
    margin: 0;
    max-width: 320px;
  }
  .spinner {
    width: 22px;
    height: 22px;
    border-radius: 999px;
    border: 2.5px solid #33333d;
    border-top-color: #ffbf00;
    animation: spin 0.8s linear infinite;
  }
  .offline .spinner { display: none; }
  .online .offline-msg { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap online" id="wrap">
    <img src="logo.svg" alt="StepAlbum" />
    <div class="spinner"></div>
    <div class="offline-msg">
      <h1>Sem conexão com a internet</h1>
      <p>Por favor, conecte-se à internet para usar o StepAlbum. Vamos entrar automaticamente assim que a conexão voltar.</p>
    </div>
  </div>
  <script>
    var PROD_URL = "https://step-album.vercel.app/?desktop=1";
    var wrap = document.getElementById("wrap");
    var checking = false;

    function setOffline(isOffline) {
      wrap.className = isOffline ? "wrap offline" : "wrap online";
    }

    function check() {
      if (checking) return;
      checking = true;
      fetch("https://step-album.vercel.app/favicon.ico", { mode: "no-cors", cache: "no-store" })
        .then(function () {
          window.location.href = PROD_URL;
        })
        .catch(function () {
          setOffline(true);
          checking = false;
        });
    }

    check();
    setInterval(check, 3000);
    window.addEventListener("online", check);
  </script>
</body>
</html>
