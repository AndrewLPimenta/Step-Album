name: Release Desktop App

# The desktop app is just a native shell that loads https://step-album.vercel.app
# — regular commits already reach it automatically the moment Vercel deploys,
# no rebuild needed. This workflow only needs to run when the SHELL itself
# changes (icon, window config, src-tauri/*) and you want to (re)distribute
# the installers. Trigger with a tag (e.g. `git tag app-v1.0.0 && git push
# --tags`) or manually from the Actions tab.
on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "StepAlbum Desktop v__VERSION__"
          releaseBody: "Instaladores para macOS e Windows."
          releaseDraft: true
          prerelease: false
